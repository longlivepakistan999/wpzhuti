<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Chip/circuit base square -->
  <rect x="8" y="12" width="32" height="28" rx="5" fill="url(#g1)"/>

  <!-- Circuit traces — left -->
  <line x1="8" y1="20" x2="3" y2="20" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="26" x2="3" y2="26" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="32" x2="3" y2="32" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>

  <!-- Circuit traces — right -->
  <line x1="40" y1="20" x2="45" y2="20" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="26" x2="45" y2="26" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="32" x2="45" y2="32" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>

  <!-- AI brain nodes inside chip -->
  <circle cx="24" cy="21" r="3" fill="white" opacity="0.95"/>
  <circle cx="16" cy="28" r="2.5" fill="white" opacity="0.8"/>
  <circle cx="32" cy="28" r="2.5" fill="white" opacity="0.8"/>
  <circle cx="24" cy="34" r="2" fill="white" opacity="0.65"/>

  <!-- Neural connections -->
  <line x1="24" y1="21" x2="16" y2="28" stroke="white" stroke-width="1.2" opacity="0.55"/>
  <line x1="24" y1="21" x2="32" y2="28" stroke="white" stroke-width="1.2" opacity="0.55"/>
  <line x1="16" y1="28" x2="24" y2="34" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="32" y1="28" x2="24" y2="34" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="16" y1="28" x2="32" y2="28" stroke="white" stroke-width="0.8" opacity="0.3"/>

  <!-- Graduation cap on top -->
  <polygon points="24,2 10,10 24,16 38,10" fill="#1E293B"/>
  <polygon points="24,2 10,10 24,16 38,10" fill="url(#g1)" opacity="0.2"/>
  <line x1="24" y1="16" x2="24" y2="12" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="34" y="10" width="1.5" height="9" fill="#F59E0B" rx="0.75"/>
  <circle cx="34.75" cy="19.5" r="2.2" fill="none" stroke="#F59E0B" stroke-width="1"/>
</svg>
