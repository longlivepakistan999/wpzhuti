<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal AI brain icon -->
  <g transform="translate(4, 3)">
    <!-- Outer hexagon -->
    <polygon points="20,1 36,10 36,30 20,39 4,30 4,10" fill="url(#grad1)" rx="3"/>
    <!-- Inner neural network nodes -->
    <circle cx="20" cy="12" r="3" fill="white" opacity="0.95"/>
    <circle cx="12" cy="22" r="2.5" fill="white" opacity="0.85"/>
    <circle cx="28" cy="22" r="2.5" fill="white" opacity="0.85"/>
    <circle cx="20" cy="28" r="2" fill="white" opacity="0.75"/>
    <circle cx="14" cy="32" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="26" cy="32" r="1.5" fill="white" opacity="0.6"/>
    <!-- Neural connections -->
    <line x1="20" y1="12" x2="12" y2="22" stroke="white" stroke-width="1.2" opacity="0.6"/>
    <line x1="20" y1="12" x2="28" y2="22" stroke="white" stroke-width="1.2" opacity="0.6"/>
    <line x1="12" y1="22" x2="20" y2="28" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="28" y1="22" x2="20" y2="28" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="12" y1="22" x2="14" y2="32" stroke="white" stroke-width="0.8" opacity="0.4"/>
    <line x1="28" y1="22" x2="26" y2="32" stroke="white" stroke-width="0.8" opacity="0.4"/>
    <line x1="20" y1="28" x2="14" y2="32" stroke="white" stroke-width="0.8" opacity="0.4"/>
    <line x1="20" y1="28" x2="26" y2="32" stroke="white" stroke-width="0.8" opacity="0.4"/>
    <!-- Pulse rings on top node -->
    <circle cx="20" cy="12" r="5" fill="none" stroke="white" stroke-width="0.6" opacity="0.3"/>
  </g>

  <!-- QWE text -->
  <text x="50" y="23" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="22" fill="#1E293B" letter-spacing="-0.5">QWE</text>

  <!-- Decorative dot -->
  <circle cx="103" cy="18" r="2.5" fill="url(#grad1)"/>

  <!-- AI Academy text -->
  <text x="50" y="40" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="11.5" fill="url(#grad2)" letter-spacing="2.5">AI ACADEMY</text>
</svg>
