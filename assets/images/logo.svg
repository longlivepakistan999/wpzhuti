<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 48" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Icon: Graduation cap + circuit chip fusion -->
  <g transform="translate(2, 2)">
    <!-- Chip/circuit base square -->
    <rect x="6" y="10" width="28" height="24" rx="4" fill="url(#g1)"/>
    <!-- Circuit traces sticking out of chip -->
    <line x1="6" y1="17" x2="2" y2="17" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="22" x2="2" y2="22" stroke="#6366F1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="27" x2="2" y2="27" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="34" y1="17" x2="38" y2="17" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="34" y1="22" x2="38" y2="22" stroke="#6366F1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="34" y1="27" x2="38" y2="27" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round"/>
    <!-- AI brain nodes inside chip -->
    <circle cx="20" cy="18" r="2.5" fill="white" opacity="0.95"/>
    <circle cx="14" cy="24" r="2" fill="white" opacity="0.8"/>
    <circle cx="26" cy="24" r="2" fill="white" opacity="0.8"/>
    <circle cx="20" cy="29" r="1.5" fill="white" opacity="0.65"/>
    <!-- Neural connections -->
    <line x1="20" y1="18" x2="14" y2="24" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="18" x2="26" y2="24" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="14" y1="24" x2="20" y2="29" stroke="white" stroke-width="0.8" opacity="0.4"/>
    <line x1="26" y1="24" x2="20" y2="29" stroke="white" stroke-width="0.8" opacity="0.4"/>
    <!-- Graduation cap on top -->
    <polygon points="20,2 8,9 20,14 32,9" fill="#1E293B"/>
    <polygon points="20,2 8,9 20,14 32,9" fill="url(#g1)" opacity="0.25"/>
    <line x1="20" y1="14" x2="20" y2="10" stroke="#1E293B" stroke-width="1"/>
    <rect x="28" y="9" width="1.2" height="8" fill="#F59E0B" rx="0.6"/>
    <circle cx="28.6" cy="17.5" r="1.8" fill="none" stroke="#F59E0B" stroke-width="0.8"/>
  </g>

  <!-- QWE brand text -->
  <text x="48" y="24" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="24" fill="#1E293B" letter-spacing="-0.5">QWE</text>

  <!-- Vertical divider -->
  <line x1="102" y1="10" x2="102" y2="36" stroke="#E2E8F0" stroke-width="1.2"/>

  <!-- AI Academy text -->
  <text x="110" y="19" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="12" fill="url(#g2)">AI</text>
  <text x="110" y="35" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="11" fill="#64748B" letter-spacing="0.5">Academy</text>
</svg>
