<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 44" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Rounded square icon with stylized Q spark -->
  <rect x="2" y="4" width="36" height="36" rx="10" fill="url(#g1)"/>
  <!-- Letter Q inside -->
  <text x="20" y="31" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="26" fill="white" text-anchor="middle">Q</text>
  <!-- AI spark accent — three small dots -->
  <circle cx="30" cy="10" r="2" fill="white" opacity="0.9"/>
  <circle cx="35" cy="7" r="1.3" fill="white" opacity="0.6"/>
  <circle cx="33" cy="14" r="1" fill="white" opacity="0.4"/>

  <!-- WE text next to icon -->
  <text x="44" y="30" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="26" fill="#1E293B" letter-spacing="-1">WE</text>

  <!-- AI Academy label -->
  <text x="44" y="42" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="9.5" fill="#6366F1" letter-spacing="3">AI ACADEMY</text>
</svg>
